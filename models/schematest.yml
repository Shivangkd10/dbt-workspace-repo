version: 2

models:
  - name: dim_listings_cleaned
    description: Cleaned table which contains Airbnb listings.

    columns:
      - name: listing_id
        description: Primary key for the listing
        tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleaned')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Entire home/apt"
                  - "Private room"
                  - "Shared room"
                  - "Hotel room"
